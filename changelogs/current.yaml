date: October 13, 2025

behavior_changes:
# *Changes that are expected to cause an incompatibility if applicable; deployment changes are likely required*
- area: http
  change: |
    Added runtime flag ``envoy.reloadable_features.reject_early_connect_data`` to reject ``CONNECT`` requests
    that receive data before Envoy sent a ``200`` response to the client. While this is not a strictly compliant behavior
    it is very common as a latency reducing measure. As such the option is disabled by default.
- area: oauth2
  change: |
    :ref:`use_refresh_token <envoy_v3_api_field_extensions.filters.http.oauth2.v3.OAuth2Config.use_refresh_token>`
    is now enabled by default. This behavioral change can be temporarily reverted by setting runtime guard
    ``envoy.reloadable_features.oauth2_use_refresh_token`` to false.
- area: oauth2
  change: |
    The ``state`` parameter in the OAuth2 authorization request has been changed to a base64url-encoded JSON object.
    The JSON object contains the original request URL and a nonce for CSRF prevention.
- area: oauth2
  change: |
    Implement the Signed Double-Submit Cookie pattern, as recommended by OWASP, by using the HMAC secret to sign and verify
    the nonce.
- area: oauth2
  change: |
    Reset CSRF token when token validation fails during redirection.
    If the CSRF token cookie is present during the redirection to the authorization server, it will be validated.
    Previously, if this validation failed, the oauth flow would fail. Now the CSRF token will simply be reset. This fixes
    the case where an hmac secret change causes a redirect flow, but the CSRF token cookie hasn't yet expired
    causing a CSRF token validation failure.
- area: oauth2
  change: |
    The access token, id token and refresh token in the cookies are now encrypted using the HMAC secret. This behavior can
    be reverted by setting the runtime guard ``envoy.reloadable_features.oauth2_encrypt_tokens`` to ``false``.
- area: oauth2
  change: |
      Starting from this release, these cookies: oauth_hmac,oauth_expires,refresh_token,oauth_nonce,code_verifier will
      not be forwarded to the upstream. This behavior can be reverted by setting the runtime guard
      ``envoy.reloadable_features.oauth2_cleanup_cookies`` to ``false``.
- area: oauth2
  change: |
    Added response code details to 401 local responses generated by the OAuth2 filter.

bug_fixes:
- area: dependency
  change: |
    Resolve dependency CVEs:

    - CVE-2025-0725: curl
    - CVE-2024-7246: gRPC
    - CVE-2024-11407: gRPC
    - CVE-2025-27817: kafka
    - CVE-2025-27818: kafka
    - CVE-2024-51745: wasmtime
    - CVE-2025-53901: wasmtime.
- area: tls
  change: |
    Fixed an issue where SANs of type ``OTHERNAME`` in a TLS cert were truncated if there was
    an embedded null octet, leading to incorrect SAN validation.
- area: http
  change: |
    Fixed a remote ``jwt_auth`` token fetch crash with two or more auth headers when ``allow_missing_or_failed`` is set.
- area: dns
  change: |
    Update c-ares to version 1.34.6 to resolve CVE-2025-0913.

    Use-after-free in c-ares can crash Envoy via compromised or malfunctioning DNS.

    advisory: https://github.com/envoyproxy/envoy/security/advisories/GHSA-fg9g-pvc4-776f.
- area: OAuth2
  change: |
    Fixed an issue where ID token and refresh token did not adhere to the :ref:`cookie_domain
    <envoy_v3_api_field_extensions.filters.http.oauth2.v3.OAuth2Credentials.cookie_domain>` field.
- area: oauth2
  change: |
    Removed runtime guard ``envoy.reloadable_features.oauth2_use_refresh_token`` and legacy code paths.
- area: oauth2
  change: |
    Fixed a bug introduced in PR [#40228](https://github.com/envoyproxy/envoy/pull/40228), where OAuth2 cookies were
    removed for requests matching the ``pass_through_matcher`` configuration. This broke setups with multiple OAuth2
    filter instances using different ``pass_through_matcher`` configurations, because the first matching instance removed
    the OAuth2 cookies--even when a passthrough was intended--impacting subsequent filters that still needed those cookies.

new_features:
- area: wasm
  change: |
    Added support for wasm plugins written in Go with the github.com/proxy-wasm/proxy-wasm-go-sdk and compiled with Go v1.24+.
- area: dns
  change: |
    Update c-ares to version 1.34.4. This upgrade exposes ``ares_reinit()`` which allows the reinitialization of c-ares channels,
    among several other new features, bug-fixes, etc.
- area: oauth2
  change: |
    Add the option to specify SameSite cookie attribute values for oauth2 supported cookies.
    To specify SameSite attribute, choose one of the values from ``strict``,``lax`` or ``none``. If not specified,
    a default value of ``disabled`` will be assigned and there will be no SameSite value in the cookie attribute. See
    :ref:`apply_on_stream_done <envoy_v3_api_field_extensions.filters.http.oauth2.v3.OAuth2Config.cookie_configs>`
    for more details.
- area: oauth2
  change: |
    Introduced PKCE(Proof Key for Code Exchange) support for OAuth2 authorization code flow.
- area: oauth2
  change: |
    Added field :ref:`stat_prefix <envoy_v3_api_field_extensions.filters.http.oauth2.v3.OAuth2Config.stat_prefix>` to allow
    differentiating between different oauth2 filters in the same filter chain.
- area: oauth2
  change: |
    Added :ref:`end_session_endpoint <envoy_v3_api_field_extensions.filters.http.oauth2.v3.OAuth2Config.end_session_endpoint>`
    to the oauth2 filter to support OIDC RP initiated logout. This field is only used when
    ``openid`` is in the :ref:`auth_scopes <envoy_v3_api_field_extensions.filters.http.oauth2.v3.OAuth2Config.auth_scopes>` field.
    If configured, the OAuth2 filter will redirect users to this endpoint when they access the
    :ref:`signout_path <envoy_v3_api_field_extensions.filters.http.oauth2.v3.OAuth2Config.signout_path>`. This allows users to
    be logged out of the Authorization server.
- area: oauth2
  change: |
    Added configurable :ref:`csrf_token_expires_in
    <envoy_v3_api_field_extensions.filters.http.oauth2.v3.OAuth2Config.csrf_token_expires_in>`
    and :ref:`code_verifier_token_expires_in
    <envoy_v3_api_field_extensions.filters.http.oauth2.v3.OAuth2Config.code_verifier_token_expires_in>`
    fields to the ``oauth2`` filter. Both default to ``600s`` (10 minutes) if not specified, keeping backward compatibility.
